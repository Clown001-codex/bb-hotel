<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BB Hotel — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #171716;
      --paper: #f5f2ec;
      --white: #fff;
      --gold: #b18442;
      --muted: #77716a;
      --line: #dfd8cd;
      --danger: #9a433a;
      --success: #52734c
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "DM Sans", sans-serif
    }

    .wrap {
      width: min(1200px, 92%);
      margin: auto
    }

    .top {
      padding: 30px 0;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .brand {
      font-family: "Cormorant Garamond", serif;
      font-size: 34px
    }

    .top button,
    .primary {
      border: 0;
      background: var(--ink);
      color: #fff;
      padding: 12px 18px;
      cursor: pointer
    }

    .login {
      min-height: 100vh;
      display: grid;
      place-items: center
    }

    .login-card,
    .panel {
      background: #fff;
      border: 1px solid var(--line);
      padding: 30px
    }

    .login-card {
      width: min(430px, 92vw)
    }

    h1,
    h2 {
      font-family: "Cormorant Garamond", serif;
      font-weight: 500
    }

    .eyebrow {
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--gold);
      font-weight: 700
    }

    .field {
      margin: 15px 0
    }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 7px
    }

    .field input,
    .field select {
      width: 100%;
      padding: 13px;
      border: 1px solid var(--line);
      background: #faf9f6
    }

    .message {
      margin-top: 12px;
      font-size: 13px
    }

    .error {
      color: var(--danger)
    }

    .dashboard {
      display: none
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 30px 0
    }

    .stat {
      background: #fff;
      border: 1px solid var(--line);
      padding: 22px
    }

    .stat strong {
      display: block;
      font-family: "Cormorant Garamond", serif;
      font-size: 34px;
      margin-top: 7px
    }

    .table-wrap {
      overflow: auto
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      background: #fff
    }

    .table th,
    .table td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      white-space: nowrap
    }

    .status {
      padding: 5px 9px;
      border-radius: 20px;
      background: #eee
    }

    .status.confirmed {
      background: #e5efe2;
      color: var(--success)
    }

    .status.cancelled {
      background: #f7e4e1;
      color: var(--danger)
    }

    .actions button {
      border: 1px solid var(--line);
      background: #fff;
      padding: 7px 10px;
      margin-right: 4px;
      cursor: pointer
    }

    .section {
      margin: 35px 0
    }

    .empty {
      padding: 30px;
      text-align: center;
      background: #fff;
      border: 1px solid var(--line);
      color: var(--muted)
    }

    @media(max-width:700px) {
      .stats {
        grid-template-columns: 1fr
      }

      .top {
        align-items: flex-start;
        gap: 20px
      }

      .top button {
        font-size: 11px
      }
    }
  </style>
</head>

<body>
  <div id="loginView" class="login">
    <form id="loginForm" class="login-card">
      <div class="eyebrow">BB HOTEL</div>
      <h1>Reservations desk</h1>
      <p>Sign in to view and manage guest reservations.</p>
      <div class="field"><label>Email</label><input id="adminEmail" type="email" required></div>
      <div class="field"><label>Password</label><input id="adminPassword" type="password" required></div>
      <button class="primary" type="submit">Sign in</button>
      <div id="loginMessage" class="message"></div>
    </form>
  </div>

  <main id="dashboard" class="dashboard">
    <div class="wrap">
      <header class="top">
        <div class="brand">BB Hotel <span class="eyebrow">ADMIN</span></div><button id="logoutBtn">Log out</button>
      </header>
      <div class="stats">
        <div class="stat">
          <div class="eyebrow">TOTAL BOOKINGS</div><strong id="totalBookings">0</strong>
        </div>
        <div class="stat">
          <div class="eyebrow">PENDING</div><strong id="pendingBookings">0</strong>
        </div>
        <div class="stat">
          <div class="eyebrow">CONFIRMED</div><strong id="confirmedBookings">0</strong>
        </div>
      </div>

      <section class="section">
        <div class="eyebrow">RESERVATIONS</div>
        <h2>Guest bookings</h2>
        <div id="bookingTable" class="table-wrap"></div>
      </section>

      <section class="section">
        <div class="eyebrow">INBOX</div>
        <h2>Contact messages</h2>
        <div id="messageTable" class="table-wrap"></div>
      </section>
    </div>
  </main>

  <script>
    const loginView = document.getElementById('loginView');
    const dashboard = document.getElementById('dashboard');
    const loginForm = document.getElementById('loginForm');
    const loginMessage = document.getElementById('loginMessage');

    async function api(url, options = {}) {
      const response = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...options });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    async function checkAuth() {
      const me = await api('/api/admin/me');
      if (me.authenticated) { showDashboard(); } else { loginView.style.display = 'grid'; dashboard.style.display = 'none'; }
    }

    loginForm.addEventListener('submit', async e => {
      e.preventDefault();
      loginMessage.textContent = '';
      try {
        await api('/api/admin/login', { method: 'POST', body: JSON.stringify({ email: adminEmail.value, password: adminPassword.value }) });
        showDashboard();
      } catch (err) { loginMessage.textContent = err.message; loginMessage.className = 'message error'; }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => { await api('/api/admin/logout', { method: 'POST' }); location.reload(); });

    async function showDashboard() {
      loginView.style.display = 'none'; dashboard.style.display = 'block'; await loadDashboard();
    }

    async function loadDashboard() {
      const [bookings, messages] = await Promise.all([api('/api/admin/bookings'), api('/api/admin/messages')]);
      totalBookings.textContent = bookings.length;
      pendingBookings.textContent = bookings.filter(b => b.status === 'pending').length;
      confirmedBookings.textContent = bookings.filter(b => b.status === 'confirmed').length;

      bookingTable.innerHTML = bookings.length ? `<table class="table"><thead><tr><th>Reference</th><th>Guest</th><th>Room</th><th>Stay</th><th>Guests</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead><tbody>${bookings.map(b => `<tr><td>${b.reference}</td><td>${b.guest_name}<br>${b.email}<br>${b.phone || ''}</td><td>${b.room_name} × ${b.room_count}</td><td>${new Date(b.checkin).toLocaleString()}<br>to<br>${new Date(b.checkout).toLocaleString()}<br>${b.nights} night(s)</td><td>${b.guests}</td><td>₦${Number(b.total_amount).toLocaleString()}</td><td><span class="status ${b.status}">${b.status}</span></td><td class="actions"><button onclick="updateBooking(${b.id},'confirmed')">Confirm</button><button onclick="updateBooking(${b.id},'cancelled')">Cancel</button><button onclick="updateBooking(${b.id},'completed')">Complete</button></td></tr>`).join('')}</tbody></table>` : '<div class="empty">No bookings yet.</div>';

      messageTable.innerHTML = messages.length ? `<table class="table"><thead><tr><th>From</th><th>Message</th><th>Date</th><th>Status</th></tr></thead><tbody>${messages.map(m => `<tr><td>${m.name}<br>${m.email}<br>${m.phone || ''}</td><td style="white-space:normal;min-width:300px">${m.message}</td><td>${new Date(m.created_at).toLocaleString()}</td><td><button onclick="markMessage(${m.id},'read')">${m.status === 'read' ? 'Read' : 'Mark read'}</button></td></tr>`).join('')}</tbody></table>` : '<div class="empty">No contact messages yet.</div>';
    }

    async function updateBooking(id, status) { try { await api('/api/admin/bookings/' + id, { method: 'PATCH', body: JSON.stringify({ status }) }); await loadDashboard(); } catch (e) { alert(e.message); } }
    async function markMessage(id, status) { try { await api('/api/admin/messages/' + id, { method: 'PATCH', body: JSON.stringify({ status }) }); await loadDashboard(); } catch (e) { alert(e.message); } }
    checkAuth();
  </script>
</body>

</html>
